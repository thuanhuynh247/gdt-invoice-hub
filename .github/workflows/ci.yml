name: CI/CD Validation Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Check Python Syntax
      run: |
        python -m compileall -q app.py config.py run_local.py auth invoices export tests scratch

    - name: Run Pytest with Coverage
      run: |
        python -m pytest -v --cov=auth --cov=invoices --cov=export --cov=app --cov-report=term-missing
